<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生主页 - 校园活动管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>校园活动管理系统</h1>
            <nav id="header-nav"></nav>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h2>学生工作台</h2>
            <p style="color: var(--text-light);">欢迎回来，浏览最新活动并管理你的报名记录。</p>
            <div class="actions">
                <a href="activities.html" class="btn btn-primary">浏览活动列表</a>
                <a href="my-enrollments.html" class="btn btn-secondary">我的报名</a>
            </div>
        </div>

        <div class="card">
            <h3>最新活动</h3>
            <div id="latest-activities" class="activity-list"></div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = requireLogin('student');
            if (!user) return;

            const list = getAllActivities().slice(0, 5);
            const container = document.getElementById('latest-activities');
            if (list.length === 0) {
                container.innerHTML = '<div class="empty">暂无活动</div>';
                return;
            }
            container.innerHTML = list.map(act => `
                <div class="activity-item">
                    <h3><a href="activity-detail.html?id=${act.id}" style="color: var(--text); text-decoration: none;">${act.title}</a></h3>
                    <div class="meta">
                        时间：${formatDateTime(act.activityTime)} · 地点：${act.place}
                        · 已报：${act.enrolledCount}/${act.capacity} 人
                        <span class="status ${statusClass(act.status)}">${statusText(act.status)}</span>
                    </div>
                </div>
            `).join('');
        });
    </script>
</body>
</html>
