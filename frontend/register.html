<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 校园活动管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>校园活动管理系统</h1>
            <nav id="header-nav"></nav>
        </div>
    </header>

    <div class="container" style="max-width: 420px;">
        <div class="card">
            <h2>注册账号</h2>
            <div id="alert-box" class="alert" style="display: none;"></div>
            <form id="register-form">
                <div class="form-group">
                    <label>账号</label>
                    <input type="text" id="username" required placeholder="请设置登录账号">
                </div>
                <div class="form-group">
                    <label>姓名</label>
                    <input type="text" id="name" required placeholder="请输入真实姓名">
                </div>
                <div class="form-group">
                    <label>角色</label>
                    <select id="role" required>
                        <option value="">请选择角色</option>
                        <option value="student">学生</option>
                        <option value="teacher">教师</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" required placeholder="请设置密码">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="password2" required placeholder="再次输入密码">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">注册</button>
            </form>
            <p style="text-align: center; margin-top: 16px; font-size: 14px;">
                已有账号？<a href="login.html" style="color: var(--primary);">去登录</a>
            </p>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('register-form').addEventListener('submit', e => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const name = document.getElementById('name').value.trim();
            const role = document.getElementById('role').value;
            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;

            if (password !== password2) {
                showAlert('alert-box', '两次输入的密码不一致', 'error');
                return;
            }
            if (password.length < 6) {
                showAlert('alert-box', '密码长度不能少于 6 位', 'error');
                return;
            }

            const result = register(username, password, name, role);
            if (result.success) {
                showAlert('alert-box', '注册成功，即将跳转到登录页', 'success');
                setTimeout(() => window.location.href = 'login.html', 1000);
            } else {
                showAlert('alert-box', result.message, 'error');
            }
        });
    </script>
</body>
</html>
