<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 校园活动管理系统</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>校园活动管理系统</h1>
            <nav id="header-nav"></nav>
        </div>
    </header>

    <div class="container" style="max-width: 420px;">
        <div class="card">
            <h2>用户登录</h2>
            <div id="alert-box" class="alert" style="display: none;"></div>
            <form id="login-form">
                <div class="form-group">
                    <label>账号</label>
                    <input type="text" id="username" required placeholder="请输入账号">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="password" required placeholder="请输入密码">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">登录</button>
            </form>
            <p style="text-align: center; margin-top: 16px; font-size: 14px;">
                还没有账号？<a href="register.html" style="color: var(--primary);">去注册</a>
            </p>
            <div class="help-text" style="margin-top: 20px;">
                演示账号：<br>
                教师：teacher01 / 123456<br>
                学生：student01 / 123456
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', e => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const result = login(username, password);
            if (result.success) {
                window.location.href = result.user.role === 'teacher'
                    ? 'teacher-home.html' : 'student-home.html';
            } else {
                showAlert('alert-box', result.message, 'error');
            }
        });
    </script>
</body>
</html>
