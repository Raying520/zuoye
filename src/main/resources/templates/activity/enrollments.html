<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <title>报名名单 - 校园活动管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 14px; }
        th, td { padding: 10px; border-bottom: 1px solid #e3e3de; text-align: left; }
        th { color: #5f5e5a; font-weight: 500; }
        .empty { text-align: center; color: #888780; padding: 24px; }
        .actions { margin-top: 24px; display: flex; gap: 12px; justify-content: center; }
        .actions form { display: inline; }
        .actions .btn { width: auto; margin-top: 0; padding: 4px 10px; font-size: 12px; }
        .group-title { font-size: 15px; font-weight: 600; margin: 24px 0 8px; padding-bottom: 6px; border-bottom: 2px solid #e3e3de; }
    </style>
</head>
<body>
<div class="container" style="max-width: 720px;">
    <h1>报名名单</h1>
    <p class="muted">
        活动：<strong th:text="${activity.title}">活动标题</strong>
        · 已通过：<strong th:text="${approvedCount}">0</strong> 人
        · 待审核：<strong th:text="${#lists.size(enrollments.?[status.name() == 'PENDING'])}">0</strong> 人
        · 候补：<strong th:text="${waitingCount}">0</strong> 人
    </p>

    <div class="banner success" th:if="${success}" th:text="${success}"></div>
    <div class="banner error" th:if="${bizError}" th:text="${bizError}"></div>

    <!-- 待审核分组 -->
    <div th:if="${!#lists.isEmpty(enrollments.?[status.name() == 'PENDING'])}">
        <div class="group-title">待审核</div>
        <table>
            <thead>
            <tr>
                <th>序号</th>
                <th>姓名</th>
                <th>报名时间</th>
                <th th:if="${activity.status.name() == 'OPEN'}" style="width: 160px;">操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e, iter : ${enrollments.?[status.name() == 'PENDING']}">
                <td th:text="${iter.index + 1}">1</td>
                <td th:text="${names.get(e.userId)}">姓名</td>
                <td th:text="${#temporals.format(e.createTime, 'yyyy-MM-dd HH:mm')}">时间</td>
                <td th:if="${activity.status.name() == 'OPEN'}">
                    <form th:action="@{/enrollments/{id}/approve(id=${e.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-success">通过</button>
                    </form>
                    <form th:action="@{/enrollments/{id}/reject(id=${e.id})}" method="post" style="display:inline;">
                        <button type="submit" class="btn btn-danger">拒绝</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 已通过分组 -->
    <div th:if="${!#lists.isEmpty(enrollments.?[status.name() == 'APPROVED'])}">
        <div class="group-title">已通过</div>
        <table>
            <thead>
            <tr>
                <th>序号</th>
                <th>姓名</th>
                <th>报名时间</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e, iter : ${enrollments.?[status.name() == 'APPROVED']}">
                <td th:text="${iter.index + 1}">1</td>
                <td th:text="${names.get(e.userId)}">姓名</td>
                <td th:text="${#temporals.format(e.createTime, 'yyyy-MM-dd HH:mm')}">时间</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 候补分组 -->
    <div th:if="${!#lists.isEmpty(enrollments.?[status.name() == 'WAITING'])}">
        <div class="group-title">候补队列</div>
        <p class="muted">以下学生按报名先后顺序排队，有人取消时将自动按顺序转正。</p>
        <table>
            <thead>
            <tr>
                <th>候补序号</th>
                <th>姓名</th>
                <th>报名时间</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e : ${enrollments.?[status.name() == 'WAITING']}">
                <td th:text="'第 ' + ${e.waitingNo} + ' 位'">1</td>
                <td th:text="${names.get(e.userId)}">姓名</td>
                <td th:text="${#temporals.format(e.createTime, 'yyyy-MM-dd HH:mm')}">时间</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- 已拒绝分组 -->
    <div th:if="${!#lists.isEmpty(enrollments.?[status.name() == 'REJECTED'])}">
        <div class="group-title">已拒绝</div>
        <table>
            <thead>
            <tr>
                <th>序号</th>
                <th>姓名</th>
                <th>报名时间</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="e, iter : ${enrollments.?[status.name() == 'REJECTED']}">
                <td th:text="${iter.index + 1}">1</td>
                <td th:text="${names.get(e.userId)}">姓名</td>
                <td th:text="${#temporals.format(e.createTime, 'yyyy-MM-dd HH:mm')}">时间</td>
            </tr>
            </tbody>
        </table>
    </div>

    <div th:if="${#lists.isEmpty(enrollments)}" class="empty">
        暂时还没有学生报名。
    </div>

    <p style="text-align:center; margin-top: 24px;">
        <a class="link" th:href="@{/activities/manage}">返回我的活动</a>
    </p>
</div>
</body>
</html>
