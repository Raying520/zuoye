<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <title>管理员工作台 - 校园活动管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .stat-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-top: 16px; }
        .stat-card { background: #f8f8f6; border: 1px solid #e3e3de; border-radius: 8px; padding: 16px; text-align: center; }
        .stat-card .number { font-size: 28px; font-weight: 600; color: #185fa5; }
        .stat-card .label { font-size: 13px; color: #5f5e5a; margin-top: 4px; }
        .nav-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-top: 24px; }
        .nav-card { border: 1px solid #e3e3de; border-radius: 8px; padding: 20px; text-align: center; cursor: pointer; text-decoration: none; color: inherit; }
        .nav-card:hover { border-color: #185fa5; }
        .nav-card h4 { color: #185fa5; margin-bottom: 6px; }
        .nav-card p { font-size: 13px; color: #5f5e5a; }
    </style>
</head>
<body>
<div class="container" style="max-width: 800px;">
    <h1>管理员工作台</h1>
    <p class="muted">平台治理与监管（FR16–FR21）</p>

    <div class="stat-cards">
        <div class="stat-card"><div class="number" th:text="${stats.userCount}">0</div><div class="label">用户总数</div></div>
        <div class="stat-card"><div class="number" th:text="${stats.activityCount}">0</div><div class="label">活动总数</div></div>
        <div class="stat-card"><div class="number" th:text="${stats.enrollmentCount}">0</div><div class="label">报名总数</div></div>
        <div class="stat-card"><div class="number" th:text="${stats.pendingEnrollmentCount}">0</div><div class="label">待审核报名</div></div>
        <div class="stat-card"><div class="number" th:text="${stats.flaggedActivityCount}">0</div><div class="label">待整改活动</div></div>
        <div class="stat-card"><div class="number" th:text="${stats.suspendedActivityCount}">0</div><div class="label">已下架活动</div></div>
    </div>

    <div class="nav-grid">
        <a class="nav-card" th:href="@{/admin/users}"><h4>用户管理</h4><p>查看用户、启用/停用账号</p></a>
        <a class="nav-card" th:href="@{/admin/activities}"><h4>活动监管</h4><p>查看全部活动、下架/恢复</p></a>
        <a class="nav-card" th:href="@{/admin/logs}"><h4>操作日志</h4><p>查看管理员关键操作记录</p></a>
    </div>

    <p style="text-align:center; margin-top: 24px;">
        <a class="link" th:href="@{/logout}">退出登录</a>
    </p>
</div>
</body>
</html>
