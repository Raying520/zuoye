<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh">
<head>
    <meta charset="UTF-8">
    <title>我的报名 - 校园活动管理系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .card { text-align: left; border: 1px solid #e3e3de; border-radius: 8px; padding: 16px; margin-bottom: 12px; background: #fff; }
        .card h3 { margin-bottom: 6px; font-size: 16px; }
        .meta { color: #5f5e5a; font-size: 13px; margin-bottom: 4px; }
    </style>
</head>
<body>
<div class="container" style="max-width: 720px;">
    <h1>我的报名</h1>
    <p class="muted">我参与的活动（FR6）</p>

    <div class="banner success" th:if="${success}" th:text="${success}"></div>
    <div class="banner error" th:if="${bizError}" th:text="${bizError}"></div>

    <div th:if="${#lists.isEmpty(items)}" class="banner">
        你还没有报名任何活动。
    </div>

    <div th:each="item : ${items}" class="card">
        <h3>
            <a th:href="@{/activities/{id}(id=${item.activity.id})}" th:text="${item.activity.title}">活动标题</a>
        </h3>
        <p class="meta">
            <span th:text="${#temporals.format(item.activity.activityTime, 'yyyy-MM-dd HH:mm')}">时间</span>
            · <span th:text="${item.activity.place}">地点</span>
        </p>
        <p class="meta">
            报名时间：<span th:text="${#temporals.format(item.enrollment.createTime, 'yyyy-MM-dd HH:mm')}">-</span>
            · 状态：
            <span th:if="${item.enrollment.status.name() == 'APPROVED'}" class="status status-open">已报名</span>
            <span th:if="${item.enrollment.status.name() == 'PENDING'}" class="status status-pending">审核中</span>
            <span th:if="${item.enrollment.status.name() == 'WAITING'}" class="status status-waiting"
                  th:text="'候补第 ' + ${item.enrollment.waitingNo} + ' 位'">候补</span>
            <span th:if="${item.enrollment.status.name() == 'REJECTED'}" class="status status-rejected">未通过审核</span>
        </p>
    </div>

    <p style="text-align:center; margin-top: 16px;">
        <a class="link" th:href="@{/activities}">去浏览活动</a>
        <a class="link" th:href="@{/}" style="margin-left: 16px;">返回首页</a>
    </p>
</div>
</body>
</html>
